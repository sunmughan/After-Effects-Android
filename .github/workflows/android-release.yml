# M7 release pipeline for EffectCraft for Android.
#
# Trigger: workflow_dispatch ONLY, from the branch that carries this file.
# It never runs on push or pull_request, so no commit can accidentally
# produce a "release" artifact, and it never merges, publishes to any
# store, or changes repository visibility. The coordinator dispatches it
# manually once (a) current-head android-ci is green, (b) the four
# release secrets below exist, and (c) the release-gate checklist in
# docs/M7_RELEASE_GATE_CHECKLIST.md has been reviewed.
#
# Signing: GitHub Actions secrets ONLY. No keystore, password, alias or
# secret value is committed, defaulted, printed, or uploaded as an
# artifact. The decoded keystore lives only in $RUNNER_TEMP on the
# ephemeral runner and is deleted by an always-run cleanup step.
# If ANY required secret is absent or empty, the job fails in the
# "Check release signing secrets" step with a clear message BEFORE any
# Gradle build runs, instead of silently falling back to a debug key
# or producing an unsigned APK/AAB and calling it a release.
#
# Required repository secrets (exact names):
#   EFFECTCRAFT_RELEASE_KEYSTORE_BASE64  - base64 of the release keystore file
#   EFFECTCRAFT_RELEASE_KEYSTORE_PASSWORD - keystore password
#   EFFECTCRAFT_RELEASE_KEY_ALIAS         - key alias inside the keystore
#   EFFECTCRAFT_RELEASE_KEY_PASSWORD      - key password
# The owner supplies these; this environment holds no release key and
# this workflow invents none. Do NOT create a keystore in this repo to
# "make the job pass" — a placeholder key would make every later
# signature unverifiable and every installed build un-updatable.
#
# Toolchain pins mirror android-ci.yml exactly (same JDK, Gradle, Rust,
# SDK/NDK, native ABIs), so a release artifact is built from the same
# toolchain as the green debug CI run. Only the build variant differs
# (release: R8 minify + resource shrink, see app/build.gradle.kts).
#
# Outputs (uploaded as one artifact, retention 90 days):
#   app-release.apk, app-release.aab, R8 mapping.txt, SHA-256 sums,
#   release dependency/license inventory.
# The job also prints the APK signer's certificate SHA-1 and SHA-256
# fingerprints, taken from the actual artifact (never invented), so
# the coordinator can deliver exact fingerprints for the Firebase
# registration step. Certificate fingerprints are not secrets: they
# are embedded in the APK itself and are safe to print and share.
# Hash behaviour: the workflow prints SHA-256 for both artifacts. Two
# release builds from the same commit with the SAME signing key are
# expected to be reproducible in content (see the debug reproducibility
# job); with a different key, or an unsigned build, raw bytes differ
# and the build is not the same release. A SHA-256 alone never proves
# a build is signed — the apksigner/signature-file verification step
# must also pass, and physical install proof is a separate gate.

name: Android release

on:
  workflow_dispatch:

permissions:
  # Read-only on purpose: a release build must not commit or push.
  contents: read

concurrency:
  group: android-release
  # Never cancel a release build mid-signing; a second dispatch waits.
  cancel-in-progress: false

jobs:
  release:
    name: Assemble signed release APK/AAB
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # FAIL-VISIBLE gate: every secret is checked, and the step names
      # each missing one. Secrets are passed via env (never echoed) and
      # GitHub masks their values in logs.
      - name: Check release signing secrets
        env:
          EFFECTCRAFT_RELEASE_KEYSTORE_BASE64: ${{ secrets.EFFECTCRAFT_RELEASE_KEYSTORE_BASE64 }}
          EFFECTCRAFT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.EFFECTCRAFT_RELEASE_KEYSTORE_PASSWORD }}
          EFFECTCRAFT_RELEASE_KEY_ALIAS: ${{ secrets.EFFECTCRAFT_RELEASE_KEY_ALIAS }}
          EFFECTCRAFT_RELEASE_KEY_PASSWORD: ${{ secrets.EFFECTCRAFT_RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          for name in EFFECTCRAFT_RELEASE_KEYSTORE_BASE64 EFFECTCRAFT_RELEASE_KEYSTORE_PASSWORD EFFECTCRAFT_RELEASE_KEY_ALIAS EFFECTCRAFT_RELEASE_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              missing="$missing $name"
            fi
          done
          if [[ -n "$missing" ]]; then
            echo "::error::Release signing secrets missing:$missing"
            echo "Set all four as repository secrets (Settings > Secrets and variables > Actions) and re-dispatch this workflow."
            echo "This job refuses to fall back to a debug key or to produce an unsigned release artifact."
            exit 1
          fi
          echo "All four release signing secrets are present (values are never printed)."

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Select Gradle launcher
        run: |
          if [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Cache Cargo registry, git sources, native target outputs and cargo-ndk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            native/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "ndk;28.2.13676358"
          accept-android-sdk-licenses: true

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --force

      - name: Build shared Rust project bridge (ARM64)
        working-directory: native
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Build shared Rust project bridge (x86_64 emulator)
        working-directory: native
        run: cargo ndk -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Verify packaged JNI ABIs
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libeffectcraft_android.so
          test -s app/src/main/jniLibs/x86_64/libeffectcraft_android.so
          file app/src/main/jniLibs/arm64-v8a/libeffectcraft_android.so
          file app/src/main/jniLibs/x86_64/libeffectcraft_android.so

      - name: Generate release dependency and license inventory
        run: |
          mkdir -p build/audit-release
          cargo metadata --format-version 1 --manifest-path native/Cargo.toml > build/audit-release/cargo-metadata.json
          python3 scripts/generate-rust-license-inventory.py < build/audit-release/cargo-metadata.json > build/audit-release/rust-license-inventory.md
          cargo tree --manifest-path native/Cargo.toml -e normal --prefix none > build/audit-release/rust-runtime-dependency-tree.txt
          $GRADLE_CMD --no-daemon :app:dependencies --configuration releaseRuntimeClasspath > build/audit-release/android-release-dependency-tree.txt
          $GRADLE_CMD --no-daemon --no-parallel :app:generateLicenseReport
          cp -R app/build/reports/dependency-license build/audit-release/android-license-report

      # Decode only into $RUNNER_TEMP (ephemeral, outside the workspace
      # and outside every uploaded artifact), with owner-only permissions.
      # The base64 value itself is never printed.
      - name: Decode release keystore
        env:
          EFFECTCRAFT_RELEASE_KEYSTORE_BASE64: ${{ secrets.EFFECTCRAFT_RELEASE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$EFFECTCRAFT_RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/effectcraft-release.keystore"
          chmod 600 "$RUNNER_TEMP/effectcraft-release.keystore"
          test -s "$RUNNER_TEMP/effectcraft-release.keystore"
          echo "Release keystore decoded to RUNNER_TEMP (not in the workspace, not uploaded)."

      - name: Assemble release APK and AAB
        env:
          EFFECTCRAFT_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.EFFECTCRAFT_RELEASE_KEYSTORE_PASSWORD }}
          EFFECTCRAFT_RELEASE_KEY_ALIAS: ${{ secrets.EFFECTCRAFT_RELEASE_KEY_ALIAS }}
          EFFECTCRAFT_RELEASE_KEY_PASSWORD: ${{ secrets.EFFECTCRAFT_RELEASE_KEY_PASSWORD }}
        run: |
          $GRADLE_CMD --no-daemon :app:assembleRelease :app:bundleRelease \
            -Peffectcraft.release.keystoreFile="$RUNNER_TEMP/effectcraft-release.keystore" \
            -Peffectcraft.release.keystorePassword="$EFFECTCRAFT_RELEASE_KEYSTORE_PASSWORD" \
            -Peffectcraft.release.keyAlias="$EFFECTCRAFT_RELEASE_KEY_ALIAS" \
            -Peffectcraft.release.keyPassword="$EFFECTCRAFT_RELEASE_KEY_PASSWORD"

      - name: Verify release artifacts are signed and hash them
        run: |
          apk="$(find app/build/outputs/apk/release -name 'app-release.apk' | head -n 1)"
          aab="$(find app/build/outputs/bundle/release -name 'app-release.aab' | head -n 1)"
          test -n "$apk" && test -s "$apk"
          test -n "$aab" && test -s "$aab"
          echo "APK: $apk"
          echo "AAB: $aab"
          # A signed APK must carry signature files; an unsigned build has none.
          if ! unzip -l "$apk" | grep -q 'META-INF/.*\.\(RSA\|DSA\|EC\)'; then
            echo "::error::Release APK has no signature files in META-INF — it is unsigned. Do not treat it as a release."
            exit 1
          fi
          # Full signature verification when apksigner is available on the
          # runner; jarsigner (JDK) verifies the v1 signature as a floor.
          # Either way the META-INF check above has already failed unsigned builds.
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort | tail -n 1)"
          if [[ -n "$apksigner" ]]; then
            "$apksigner" verify --verbose "$apk"
          else
            echo "apksigner not found under build-tools; falling back to jarsigner v1 verification (physical install remains the final proof)."
            jarsigner -verify "$apk"
          fi
          sha256sum "$apk" "$aab" | tee build/audit-release/release-artifact-sha256.txt
          echo "APK and AAB are present, signed (see checks above), and hashed."

      # Fail closed if the release APK was signed with the Android debug
      # key by accident: the default debug certificate carries the DN
      # "CN=Android Debug, O=Android, C=US", which no release key must
      # ever have. Checked from the artifact itself, so it holds no
      # matter which keystore path the build took.
      - name: Reject release APK signed with the debug key
        run: |
          apk="$(find app/build/outputs/apk/release -name 'app-release.apk' | head -n 1)"
          test -n "$apk" && test -s "$apk"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort | tail -n 1)"
          if [[ -n "$apksigner" ]]; then
            certs="$("$apksigner" verify --print-certs "$apk")"
          else
            certs="$(keytool -printcert -jarfile "$apk")"
          fi
          echo "$certs"
          if echo "$certs" | grep -qi "CN=Android Debug"; then
            echo "::error::Release APK is signed with the Android debug certificate. Refusing to treat it as a release."
            exit 1
          fi
          echo "Release APK signer is not the Android debug certificate."

      # Fingerprints are read from the artifact that was just built,
      # never invented or copied from another build. When the secrets
      # gate passed, this is the release certificate; the step labels
      # the output as "the signer actually present in this artifact"
      # so a reader can never mistake it for a claimed release cert
      # if the artifact somehow were not release-signed. (The secrets
      # gate above already fails the job before any build when the
      # release secrets are absent, so an unsigned artifact reaching
      # this step would mean the earlier signature check also failed
      # and the job would already have stopped there.)
      - name: Print signing certificate fingerprints
        run: |
          apk="$(find app/build/outputs/apk/release -name 'app-release.apk' | head -n 1)"
          test -n "$apk" && test -s "$apk"
          echo "Signing certificate fingerprints for $apk (signer actually present in this artifact):"
          apksigner="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -name apksigner -type f 2>/dev/null | sort | tail -n 1)"
          if [[ -n "$apksigner" ]]; then
            "$apksigner" verify --print-certs "$apk"
          else
            echo "apksigner not found under build-tools; falling back to keytool -printcert."
            keytool -printcert -jarfile "$apk"
          fi
          echo "Record the SHA-1 and SHA-256 values above exactly as printed for Firebase registration; do not retype them from memory."

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-android-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
            build/audit-release/
          if-no-files-found: error
          retention-days: 90

      # Always runs, even if the build failed, so no keystore survives on
      # the runner beyond this job. (Runners are ephemeral regardless;
      # this is defence in depth, not the only protection.)
      - name: Delete decoded release keystore
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/effectcraft-release.keystore"
          echo "Decoded release keystore deleted."
