name: Android CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Assemble and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "ndk;28.2.13676358"
          accept-android-sdk-licenses: true

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build shared Rust project bridge (ARM64)
        working-directory: native
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Test Rust bridge
        run: cargo test --manifest-path native/Cargo.toml

      - name: Generate resolved dependency and license inventory
        run: |
          mkdir -p build/audit
          cargo metadata --format-version 1 --manifest-path native/Cargo.toml > build/audit/cargo-metadata.json
          python3 scripts/generate-rust-license-inventory.py < build/audit/cargo-metadata.json > build/audit/rust-license-inventory.md
          cargo tree --manifest-path native/Cargo.toml -e normal --prefix none > build/audit/rust-runtime-dependency-tree.txt
          gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > build/audit/android-runtime-dependency-tree.txt
          gradle --no-daemon --no-parallel :app:generateLicenseReport
          cp -R app/build/reports/dependency-license build/audit/android-license-report

      - name: Assemble debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Run Android emulator smoke tests (M1)\n        uses: reactivecircus/android-emulator-runner@v2\n        with:\n          api-level: 35\n          target: google_apis\n          arch: x86_64\n          profile: pixel_6\n          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none\n          disable-animations: true\n          script: gradle --no-daemon :app:connectedDebugAndroidTest\n\n      - name: Upload Android build and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-android-build-and-audit
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            native/Cargo.lock
            build/audit/
          if-no-files-found: error
          retention-days: 30
