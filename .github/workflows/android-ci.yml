name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/android-app-foundation]
  workflow_dispatch:

permissions:
  contents: write

# Avoid spending runners on stale commits while the PR is actively changing.
concurrency:
  group: android-ci-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android:
    name: Assemble and test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # The emulator system image is installed late, after two Rust Android
      # ABIs and Gradle outputs have consumed runner storage. CI #665 failed
      # here with "No space left on device" while sdkmanager unpacked API 30.
      # Reclaim unrelated hosted-runner runtimes/packages before tool setup;
      # retain the preinstalled Android SDK and swap, then install JDK/Rust
      # explicitly below. This changes runner capacity, not test coverage.
      - name: Reclaim unused hosted-runner disk space
        run: df -h /
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: true
          swap-storage: false
      - name: Confirm runner disk space after cleanup
        run: df -h /

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      # Bootstrap the official Wrapper once; GITHUB_TOKEN avoids exposing any personal credential.
      # The resulting files are committed to this feature branch for reproducible clean checkouts.
      - name: Generate and commit pinned Gradle Wrapper if missing
        if: github.event_name == 'push'
        run: |
          if [[ ! -f gradle/wrapper/gradle-wrapper.jar ]]; then
            gradle --no-daemon wrapper --gradle-version=9.5.0 --distribution-type=bin
            checksum="$(curl -fsSL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip.sha256 | awk '{print $1}' )"
            printf '\ndistributionSha256Sum=%s\n' "$checksum" >> gradle/wrapper/gradle-wrapper.properties
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            git commit -m "build: add pinned Gradle wrapper"
            # CI checkout can be behind commits made while its runner was starting.
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Select Gradle launcher
        run: |
          if [[ -f gradle/wrapper/gradle-wrapper.jar ]]; then
            echo "GRADLE_CMD=./gradlew" >> "$GITHUB_ENV"
          else
            echo "GRADLE_CMD=gradle" >> "$GITHUB_ENV"
          fi

      - name: Cache Cargo registry, git sources, native target outputs and cargo-ndk
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            native/target
          key: rust-${{ runner.os }}-${{ hashFiles('native/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "ndk;28.2.13676358"
          accept-android-sdk-licenses: true

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        # The workflow caches ~/.cargo/bin/cargo-ndk, so a restored cache
        # leaves the binary in place and a plain install fails with
        # "binary already exists". --force overwrites it; --locked still
        # pins the version, so this changes no toolchain version.
        run: cargo install cargo-ndk --locked --force

      - name: Build shared Rust project bridge (ARM64)
        working-directory: native
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Build shared Rust project bridge (x86_64 emulator)
        working-directory: native
        run: cargo ndk -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Verify packaged JNI ABIs
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libeffectcraft_android.so
          test -s app/src/main/jniLibs/x86_64/libeffectcraft_android.so
          file app/src/main/jniLibs/arm64-v8a/libeffectcraft_android.so
          file app/src/main/jniLibs/x86_64/libeffectcraft_android.so

      - name: Test Rust bridge
        run: cargo test --manifest-path native/Cargo.toml

      - name: Generate resolved dependency and license inventory
        run: |
          mkdir -p build/audit
          cargo metadata --format-version 1 --manifest-path native/Cargo.toml > build/audit/cargo-metadata.json
          python3 scripts/generate-rust-license-inventory.py < build/audit/cargo-metadata.json > build/audit/rust-license-inventory.md
          cargo tree --manifest-path native/Cargo.toml -e normal --prefix none > build/audit/rust-runtime-dependency-tree.txt
          $GRADLE_CMD --no-daemon :app:dependencies --configuration debugRuntimeClasspath > build/audit/android-runtime-dependency-tree.txt
          $GRADLE_CMD --no-daemon --no-parallel :app:generateLicenseReport
          cp -R app/build/reports/dependency-license build/audit/android-license-report

      - name: Assemble debug APK
        run: $GRADLE_CMD --no-daemon :app:assembleDebug

      - name: Run unit tests
        run: $GRADLE_CMD --no-daemon :app:testDebugUnitTest

      # M7: the release variant must also assemble with NO signing secrets
      # (unsigned), proving R8/proguard and the release build type work and
      # that a missing secret degrades to "unsigned, clearly logged" instead
      # of failing CI or silently signing with the debug key. This is a
      # build-shape check only: the unsigned APK/AAB here are never release
      # artifacts and are not uploaded. The signed release path stays in
      # android-release.yml, which fails before Gradle when secrets are absent.
      - name: Assemble unsigned release APK and AAB (no secrets)
        run: $GRADLE_CMD --no-daemon :app:assembleRelease :app:bundleRelease

      - name: Verify release outputs are unsigned (no debug-key fallback)
        run: |
          apk="$(find app/build/outputs/apk/release -name 'app-release*.apk' | head -n 1)"
          aab="$(find app/build/outputs/bundle/release -name 'app-release.aab' | head -n 1)"
          test -n "$apk" && test -s "$apk"
          test -n "$aab" && test -s "$aab"
          echo "Unsigned release APK: $apk"
          echo "Unsigned release AAB: $aab"
          # A signed APK carries signature files in META-INF; an unsigned
          # build has none. Any signature here means the build silently
          # picked up a key (e.g. the debug key) and must fail closed.
          if unzip -l "$apk" | grep -q 'META-INF/.*\.\(RSA\|DSA\|EC\)'; then
            echo "::error::Release APK unexpectedly carries signature files — it was signed (possibly with the debug key). Refusing to pass an unsigned-release check on a signed artifact."
            exit 1
          fi
          test -s app/build/outputs/mapping/release/mapping.txt
          echo "Release APK/AAB assembled unsigned (no signature files) and R8 mapping.txt exists."

      - name: Enable KVM access for Android emulator
        run: |
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ls -l /dev/kvm
          else
            echo "GitHub runner has no /dev/kvm device; emulator instrumentation cannot run on this host."
            exit 1
          fi

      # CI 42353512019 diagnosis (head 8df81a9): the emulator died mid-run,
      # not the app. The in-flight test
      # AdaptiveWorkspaceSmokeTest.canonical3dTransformKeyframeControlsTargetSelectedLayerAndCurrentFrame
      # was marked FAILED with NO assertion error; the log shows only
      # "device offline" while retrieving its outputs, then
      # "device 'emulator-5554' not found", "Test run failed to complete.
      # Expected 167 tests, received 2", and the runner's own
      # `adb emu kill` failing with "Connection refused" — the emulator
      # process itself was gone. A test cannot kill the emulator process;
      # this is host/infra flakiness. So the suite is retried ONCE on a
      # FRESH emulator (full 167-test run, nothing skipped, nothing
      # weakened) and the job only fails if both attempts fail. The AVD
      # also gets more guest RAM than the pixel_2 default (1536M) to
      # reduce memory-pressure kills.
      - name: Run Android emulator smoke tests (M1)
        id: smoke
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" == "1" ]]; do sleep 3; done'
            timeout 60 bash -c 'until adb shell cmd package list packages >/dev/null 2>&1; do sleep 2; done'
            adb shell settings put global animator_duration_scale 0
            $GRADLE_CMD --no-daemon :app:connectedDebugAndroidTest

      # Retry the FULL suite on a fresh emulator when the first attempt
      # failed (emulator death or a genuine failure — the retry changes
      # no test and re-runs all 167). The gate step below fails the job
      # unless at least one attempt passed, so a real test failure still
      # fails CI; only an infra death on attempt 1 followed by a green
      # attempt 2 goes green.
      - name: Retry Android emulator smoke tests on a fresh emulator (M1)
        id: smoke-retry
        if: steps.smoke.outcome == 'failure'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 900
          script: |
            adb wait-for-device
            timeout 240 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\\r")" == "1" ]]; do sleep 3; done'
            timeout 60 bash -c 'until adb shell cmd package list packages >/dev/null 2>&1; do sleep 2; done'
            adb shell settings put global animator_duration_scale 0
            $GRADLE_CMD --no-daemon :app:connectedDebugAndroidTest

      - name: Fail if emulator smoke tests failed on both attempts
        if: steps.smoke.outcome == 'failure' && steps.smoke-retry.outcome != 'success'
        run: |
          echo "::error::Emulator smoke tests failed on both attempts (first: ${{ steps.smoke.outcome }}, retry: ${{ steps.smoke-retry.outcome }}). See the connected-test reports."
          exit 1

      - name: Upload Android build and audit reports
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-android-build-and-audit
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/mapping/release/mapping.txt
            native/Cargo.lock
            build/audit/
          if-no-files-found: error
          retention-days: 30

      # Per-test evidence: prior runs proved only aggregate counts (19/19)
      # because the log carries no test names and the build artifact carries
      # no test XMLs. This step uploads the actual JUnit XMLs the runners
      # produce, so each named test can be proven individually. It runs
      # even when tests fail (if: always) so a failing run still publishes
      # its partial results; it changes no test, threshold, or other step.
      - name: Upload test result reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-android-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/outputs/androidTest-results/connected/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/androidTests/connected/
          # Test compilation can fail before XML exists; preserve the primary
          # failure and still publish any partial reports without a second error.
          if-no-files-found: warn
          retention-days: 30

  # M0 criterion #1 (repository builds reproducibly): a second, independent
  # build of the SAME workflow run's commit on a fresh runner, compared
  # against the android job's APK. This job intentionally restores NO
  # cache (no actions/cache, no setup-gradle cache) so the rebuild is
  # not warmed by the first build's outputs, and it pins the checkout
  # to github.sha, the same commit the android job built. It rebuilds
  # only what determines the artifact (both native ABIs + assembleDebug);
  # unit/emulator tests do not change the APK, so they are not re-run
  # here. It changes no existing step or threshold in the android job.
  # The comparison reports three levels (see
  # scripts/compare-reproducibility.py): raw APK bytes, APK content
  # entries excluding debug-signature files, and native .so bytes. The
  # job fails on a content or native mismatch; a raw-bytes mismatch
  # alone is reported, not failed, because a debug APK is signed with
  # the fresh runner's ephemeral debug keystore.
  reproducibility:
    name: Rebuild and compare debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: android
    steps:
      - name: Check out source at the same commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Keep the independent rebuild cold while freeing unrelated runner
      # runtimes; Android SDK itself is retained and setup-android follows.
      - name: Reclaim unused hosted-runner disk space
        run: df -h /
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: true
          swap-storage: false
      - name: Confirm runner disk space after cleanup
        run: df -h /

      - name: Record rebuilt commit
        run: |
          git rev-parse HEAD
          git status --porcelain

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Set up Android SDK and NDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          packages: "ndk;28.2.13676358"
          accept-android-sdk-licenses: true

      - name: Configure Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked --force

      - name: Build shared Rust project bridge (ARM64)
        working-directory: native
        run: cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release

      - name: Build shared Rust project bridge (x86_64 emulator)
        working-directory: native
        run: cargo ndk -t x86_64 -o ../app/src/main/jniLibs build --release

      - name: Verify packaged JNI ABIs
        run: |
          test -s app/src/main/jniLibs/arm64-v8a/libeffectcraft_android.so
          test -s app/src/main/jniLibs/x86_64/libeffectcraft_android.so

      - name: Assemble debug APK (second build)
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Download first-build APK artifact
        uses: actions/download-artifact@v4
        with:
          name: effectcraft-android-build-and-audit
          path: first-build

      - name: Compare first and second builds
        run: |
          first_apk="$(find first-build -name 'app-debug.apk' | head -n 1)"
          test -n "$first_apk"
          test -s "$first_apk"
          python3 scripts/compare-reproducibility.py \
            "$first_apk" \
            app/build/outputs/apk/debug/app-debug.apk \
            reproducibility-report.txt

      - name: Upload reproducibility report and second APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-android-reproducibility
          path: |
            reproducibility-report.txt
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
